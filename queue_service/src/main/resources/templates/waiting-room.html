<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waiting Room War Tiket - TIKARA</title>
    <link rel="stylesheet" href="http://localhost:8081/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body style="background:var(--bg-gradient); color:white;">
    <main style="max-width:600px; margin:5rem auto; padding:0 1.5rem; text-align:center;">
        <div class="profile-card" style="padding:3rem; background:white; color:var(--text-main);">
            <i class="fa-solid fa-stopwatch fa-4x" style="color:var(--accent-color); margin-bottom:1rem;"></i>
            <h2 style="font-size:1.8rem; font-weight:800; color:var(--primary-color);">Virtual Waiting Room TIKARA</h2>
            <p style="color:var(--text-muted); font-size:0.95rem; margin-bottom:2rem;">Kamu sedang berada di dalam ruang tunggu antrean war tiket resmi</p>

            <div style="background:#F8FAFC; padding:1.5rem; border-radius:16px; border:2px solid var(--border-color); margin-bottom:2rem;">
                <span style="font-size:0.85rem; color:var(--text-muted); display:block;">Nomor Antrean Kamu</span>
                <strong style="font-size:3rem; color:var(--primary-color); font-weight:800;" id="queueNumber">#014</strong>
                <p style="font-size:0.85rem; color:var(--secondary-color); margin-top:0.5rem;"><i class="fa-solid fa-spinner fa-spin"></i> Memproses antrean di depan kamu...</p>
            </div>

            <button class="btn btn-accent" id="btnProceedQueue" style="width:100%;" onclick="proceedToSelection()">
                MASUK KE PEMILIHAN TIKET <i class="fa-solid fa-arrow-right"></i>
            </button>
        </div>
    </main>

    <script src="http://localhost:8081/js/script.js"></script>
    <script>
        function proceedToSelection() {
            window.location.href = 'http://localhost:8083/pilih-tiket.html';
        }
    </script>
</body>
</html>

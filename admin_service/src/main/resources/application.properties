spring.application.name=admin_service

server.port=8089

spring.datasource.url=jdbc:postgresql://localhost:5432/db_admin_service
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Realtime Microservices Database URLs for Metrics
metrics.datasource.user.url=jdbc:postgresql://localhost:5432/db_user_service
metrics.datasource.event.url=jdbc:postgresql://localhost:5432/db_event_service
metrics.datasource.order.url=jdbc:postgresql://localhost:5432/db_order_service
metrics.datasource.ticket.url=jdbc:postgresql://localhost:5432/db_ticket_service
metrics.datasource.username=postgres
metrics.datasource.password=postgres
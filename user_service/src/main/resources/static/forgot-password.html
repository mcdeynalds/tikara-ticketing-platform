<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lupa Kata Sandi - TIKARA Platform Konser</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Guest Navbar (Context: Account Recovery) -->
    <header class="navbar">
        <div class="navbar-container">
            <a href="http://localhost:8082/index.html" class="navbar-logo">
                <i class="fa-solid fa-ticket"></i> TIKARA
            </a>
            <ul class="navbar-menu">
                <li><a href="http://localhost:8082/index.html" class="navbar-link"><i class="fa-solid fa-compass"></i> Beranda</a></li>
            </ul>
            <div class="navbar-actions">
                <a href="/login.html" class="btn btn-outline" style="width:auto; padding:0.5rem 1.3rem; font-size:0.9rem; color:white; border-color:rgba(255,255,255,0.3);">Masuk</a>
            </div>
        </div>
    </header>

    <!-- Auth Form Card -->
    <main class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <h2>Lupa Kata Sandi?</h2>
                <p>Masukkan email akun Anda. Kami akan mengirimkan kode verifikasi OTP 6-digit.</p>
            </div>

            <form id="forgotPasswordForm">
                <div class="form-group">
                    <label for="email" class="form-label">Email Akun Terdaftar</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-envelope input-icon"></i>
                        <input type="email" id="email" class="form-input" placeholder="Masukkan alamat email terdaftar" required autocomplete="email">
                    </div>
                    <span class="field-error" id="emailError"></span>
                </div>

                <button type="submit" class="btn btn-accent" id="btnSubmit" style="margin-top:0.5rem; cursor:pointer;">
                    <i class="fa-solid fa-paper-plane"></i> KIRIM KODE OTP <span class="btn-spinner" id="btnSpinner"></span>
                </button>
            </form>

            <div class="auth-footer" style="margin-top:1.5rem;">
                Ingat kata sandi Anda? <a href="/login.html" class="auth-link">Halaman Masuk</a>
            </div>
        </div>
    </main>

    <script src="/js/script.js"></script>
    <script>
        document.getElementById('forgotPasswordForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const emailInput = document.getElementById('email');
            const email = emailInput.value.trim();
            const emailError = document.getElementById('emailError');
            const btnSubmit = document.getElementById('btnSubmit');
            const btnSpinner = document.getElementById('btnSpinner');

            emailError.innerText = '';
            if (!email) {
                emailError.innerText = 'Alamat email wajib diisi';
                return;
            }

            btnSubmit.disabled = true;
            btnSpinner.style.display = 'inline-block';

            try {
                const res = await fetch('/api/auth/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });

                const data = await res.json().catch(() => ({}));

                if (res.ok) {
                    showToast('Kode OTP 6-digit berhasil dikirim ke email Anda!', 'success');
                    setTimeout(() => {
                        window.location.href = `/verify-otp.html?email=${encodeURIComponent(email)}`;
                    }, 1200);
                } else {
                    console.error('Forgot password API error:', data);
                    let msg = data.message;
                    if (!msg || msg.includes('No static resource') || msg.includes('INTERNAL_SERVER_ERROR')) {
                        msg = 'Terjadi kesalahan saat mengirim kode OTP. Silakan coba lagi beberapa saat.';
                    }
                    emailError.innerText = msg;
                    showToast(msg, 'error');
                }
            } catch (err) {
                console.error('Connection error:', err);
                emailError.innerText = 'Gagal terhubung ke server backend.';
                showToast('Gagal terhubung ke server backend.', 'error');
            } finally {
                btnSubmit.disabled = false;
                btnSpinner.style.display = 'none';
            }
        });
    </script>
</body>
</html>

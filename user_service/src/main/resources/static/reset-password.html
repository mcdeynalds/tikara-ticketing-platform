<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buat Kata Sandi Baru - TIKARA Platform Konser</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Guest Navbar (Context: Reset Password) -->
    <header class="navbar">
        <div class="navbar-container">
            <a href="http://localhost:8082/index.html" class="navbar-logo">
                <i class="fa-solid fa-ticket"></i> TIKARA
            </a>
            <ul class="navbar-menu">
                <li><a href="http://localhost:8082/index.html" class="navbar-link"><i class="fa-solid fa-compass"></i> Beranda</a></li>
            </ul>
            <div class="navbar-actions">
                <a href="/login.html" class="btn btn-outline" style="width:auto; padding:0.5rem 1.3rem; font-size:0.9rem; color:white; border-color:rgba(255,255,255,0.3);">Masuk</a>
            </div>
        </div>
    </header>

    <!-- Auth Form Card -->
    <main class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <h2>Buat Kata Sandi Baru</h2>
                <p>Masukkan kata sandi baru yang kuat untuk akun Anda</p>
            </div>

            <form id="resetPasswordForm">
                <div class="form-group">
                    <label for="newPassword" class="form-label">Kata Sandi Baru</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock input-icon"></i>
                        <input type="password" id="newPassword" class="form-input" placeholder="Masukkan kata sandi baru" required autocomplete="new-password">
                        <i class="fa-solid fa-eye toggle-password" id="toggleNewPass" onclick="togglePasswordVisibility('newPassword', 'toggleNewPass')"></i>
                    </div>
                    <div style="height:4px; width:100%; background:#E2E8F0; border-radius:2px; margin-top:0.4rem; overflow:hidden;">
                        <div id="strengthBar" style="height:100%; width:0%; transition:all 0.3s; background:var(--danger-color);"></div>
                    </div>
                    <span id="strengthText" style="font-size:0.75rem; color:var(--text-muted); margin-top:0.2rem; display:block;">Kekuatan password</span>
                    <span class="field-error" id="newPasswordError"></span>
                </div>

                <div class="form-group">
                    <label for="confirmPassword" class="form-label">Konfirmasi Kata Sandi Baru</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock input-icon"></i>
                        <input type="password" id="confirmPassword" class="form-input" placeholder="Masukkan ulang kata sandi baru" required autocomplete="new-password">
                        <i class="fa-solid fa-eye toggle-password" id="toggleConfirmPass" onclick="togglePasswordVisibility('confirmPassword', 'toggleConfirmPass')"></i>
                    </div>
                    <span class="field-error" id="confirmPasswordError"></span>
                </div>

                <button type="submit" class="btn btn-accent" id="btnSubmit" style="margin-top:0.5rem; cursor:pointer;">
                    <i class="fa-solid fa-key"></i> UBAH KATA SANDI <span class="btn-spinner" id="btnSpinner"></span>
                </button>
            </form>

            <div class="auth-footer" style="margin-top:1.5rem;">
                Ingat kata sandi Anda? <a href="/login.html" class="auth-link">Halaman Masuk</a>
            </div>
        </div>
    </main>

    <script src="/js/script.js"></script>
    <script>
        function togglePasswordVisibility(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            if (!input) return;
            if (input.type === 'password') {
                input.type = 'text';
                if (icon) icon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                input.type = 'password';
                if (icon) icon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }

        const urlParams = new URLSearchParams(window.location.search);
        let resetToken = urlParams.get('token') || sessionStorage.getItem('resetToken');

        // Password strength meter
        document.getElementById('newPassword').addEventListener('input', (e) => {
            const val = e.target.value;
            const bar = document.getElementById('strengthBar');
            const txt = document.getElementById('strengthText');
            
            let score = 0;
            if (val.length >= 8) score++;
            if (/[A-Z]/.test(val)) score++;
            if (/[0-9]/.test(val)) score++;
            if (/[@$!%*?&#]/.test(val)) score++;

            if (score <= 1) {
                bar.style.width = '25%'; bar.style.background = '#EF4444'; txt.innerText = 'Kekuatan: Lemah';
            } else if (score === 2 || score === 3) {
                bar.style.width = '65%'; bar.style.background = '#F59E0B'; txt.innerText = 'Kekuatan: Sedang';
            } else if (score === 4) {
                bar.style.width = '100%'; bar.style.background = '#10B981'; txt.innerText = 'Kekuatan: Sangat Kuat';
            }
        });

        document.getElementById('resetPasswordForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            const newError = document.getElementById('newPasswordError');
            const confirmError = document.getElementById('confirmPasswordError');
            const btnSubmit = document.getElementById('btnSubmit');
            const btnSpinner = document.getElementById('btnSpinner');

            newError.innerText = '';
            confirmError.innerText = '';

            if (newPassword.length < 8) {
                newError.innerText = 'Kata sandi minimal 8 karakter';
                return;
            }
            if (newPassword !== confirmPassword) {
                confirmError.innerText = 'Konfirmasi kata sandi tidak cocok';
                return;
            }
            if (!resetToken) {
                showToast('Token reset password tidak ditemukan. Silakan minta kode baru.', 'error');
                return;
            }

            btnSubmit.disabled = true;
            btnSpinner.style.display = 'inline-block';

            try {
                const res = await fetch('/api/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: resetToken, kataSandiBaru: newPassword })
                });

                const data = await res.json();

                if (res.ok) {
                    sessionStorage.removeItem('resetToken');
                    showToast('Kata sandi berhasil diubah! Silakan login dengan password baru.', 'success');
                    setTimeout(() => {
                        window.location.href = '/login.html';
                    }, 1500);
                } else {
                    const msg = data.message || 'Gagal mengubah kata sandi.';
                    showToast(msg, 'error');
                }
            } catch (err) {
                showToast('Gagal terhubung ke server backend.', 'error');
            } finally {
                btnSubmit.disabled = false;
                btnSpinner.style.display = 'none';
            }
        });
    </script>
</body>
</html>

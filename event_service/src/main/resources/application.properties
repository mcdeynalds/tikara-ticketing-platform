spring.application.name=event_service

# Port 8082 agar tidak bentrok dengan user-service (8081)
server.port=8082

# Koneksi ke database fisik db_event_service
spring.datasource.url=jdbc:postgresql://localhost:5432/db_event_service
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JWT Configuration (Secret HARUS SAMA dengan user-service agar token JWT pembeli/organizer bisa terbaca)
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

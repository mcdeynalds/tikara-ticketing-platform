<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gate Scanner E-Tiket - TIKARA</title>
    <link rel="stylesheet" href="http://localhost:8081/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body style="background:#0F172A; color:white;">
    <main style="max-width:600px; margin:4rem auto; padding:0 1.5rem; text-align:center;">
        <div class="profile-card" style="padding:2.5rem; background:white; color:var(--text-main);">
            <i class="fa-solid fa-qrcode fa-5x" style="color:var(--primary-color); margin-bottom:1rem;"></i>
            <h2 style="font-size:1.6rem; font-weight:800; color:var(--primary-color);">Gate E-Ticket Scanner</h2>
            <p style="color:var(--text-muted); font-size:0.9rem; margin-bottom:1.5rem;">Arahkan QR Code Tiket ke Scanner / Input Kode Tiket</p>

            <div class="input-wrapper" style="margin-bottom:1.5rem;">
                <input type="text" id="ticketCode" class="form-input no-icon" placeholder="e.g. TKT-2026-1001" style="text-align:center; font-family:monospace; font-weight:700; font-size:1.1rem;">
            </div>

            <button class="btn btn-accent" style="width:100%;" onclick="simulateCheckin()">
                <i class="fa-solid fa-barcode"></i> SCAN & CHECK-IN TIKET
            </button>
        </div>
    </main>
    <script src="http://localhost:8081/js/script.js"></script>
    <script>
        function simulateCheckin() {
            showToast('✓ CHECK-IN SUCCESS! Tiket Valid (VIP Front Row)', 'success');
        }
    </script>
</body>
</html>

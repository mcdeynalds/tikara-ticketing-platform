<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pilih Tiket - TIKARA</title>
    <link rel="stylesheet" href="http://localhost:8081/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="navbar">
        <div class="navbar-container">
            <a href="http://localhost:8082/index.html" class="navbar-logo"><i class="fa-solid fa-ticket"></i> TIKARA</a>
            <div class="navbar-actions">
                <a href="http://localhost:8082/index.html" class="btn btn-outline" style="color:white; width:auto; padding:0.5rem 1rem;">Batal</a>
            </div>
        </div>
    </header>

    <main style="max-width:800px; margin:2.5rem auto; padding:0 1.5rem;">
        <div class="profile-card" style="padding:2.5rem;">
            <h2 style="font-size:1.6rem; font-weight:800; color:var(--primary-color); margin-bottom:0.4rem;">Pilih Kategori Tiket</h2>
            <p style="color:var(--text-muted); font-size:0.9rem; margin-bottom:1.5rem;">Tentukan tiket dan jumlah yang ingin kamu beli</p>

            <div id="ticketCategoriesList" style="display:flex; flex-direction:column; gap:1rem; margin-bottom:2rem;">
                <div style="border:2px solid var(--accent-color); border-radius:12px; padding:1.25rem; background:rgba(255,90,95,0.03); display:flex; justify-content:space-between; align-items:center;">
                    <div>
                        <h4 style="font-size:1.1rem; color:var(--primary-color);">VIP Front Row</h4>
                        <p style="color:var(--text-muted); font-size:0.85rem;">Posisi paling depan + Fast Track Entrance</p>
                        <strong style="color:var(--accent-color); font-size:1.2rem; display:block; margin-top:0.3rem;">Rp 2.500.000</strong>
                    </div>
                    <div style="display:flex; align-items:center; gap:0.8rem;">
                        <button class="btn btn-outline" style="width:36px; height:36px; padding:0;" onclick="updateQty(-1)">-</button>
                        <span id="ticketQty" style="font-size:1.2rem; font-weight:800;">1</span>
                        <button class="btn btn-outline" style="width:36px; height:36px; padding:0;" onclick="updateQty(1)">+</button>
                    </div>
                </div>
            </div>

            <div style="border-top:2px solid var(--border-color); padding-top:1.5rem; display:flex; justify-content:space-between; align-items:center;">
                <div>
                    <span style="font-size:0.85rem; color:var(--text-muted);">Total Pembayaran</span>
                    <h3 style="font-size:1.6rem; color:var(--accent-color); font-weight:800;" id="totalPriceText">Rp 2.500.000</h3>
                </div>
                <button class="btn btn-accent" style="width:auto; padding:0.8rem 2rem;" onclick="proceedCheckout()">
                    LANJUT KE CHECKOUT <i class="fa-solid fa-arrow-right"></i>
                </button>
            </div>
        </div>
    </main>

    <script src="http://localhost:8081/js/script.js"></script>
    <script>
        let qty = 1;
        const unitPrice = 2500000;

        function updateQty(delta) {
            if (qty + delta >= 1 && qty + delta <= 5) {
                qty += delta;
                document.getElementById('ticketQty').innerText = qty;
                const total = qty * unitPrice;
                document.getElementById('totalPriceText').innerText = `Rp ${total.toLocaleString('id-ID')}`;
            }
        }

        function proceedCheckout() {
            window.location.href = `http://localhost:8084/checkout.html?qty=${qty}&price=${unitPrice}`;
        }
    </script>
</body>
</html>

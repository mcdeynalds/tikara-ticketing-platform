<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pusat Notifikasi - TIKARA</title>
    <meta name="description" content="Pemberitahuan terkini seputar pesanan tiket, status pembayaran, dan konser favorit Anda di TIKARA.">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .notif-container {
            max-width: 860px;
            margin: 2.5rem auto;
            padding: 0 1.5rem;
        }
        .notif-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .filter-tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            overflow-x: auto;
            padding-bottom: 0.5rem;
        }
        .filter-tab {
            padding: 0.5rem 1.1rem;
            border-radius: 999px;
            border: 1px solid var(--border-color);
            background: white;
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
        }
        .filter-tab:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
        }
        .filter-tab.active {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
            box-shadow: 0 4px 12px rgba(124, 58, 237, 0.2);
        }
        .notif-card {
            background: white;
            border-radius: 14px;
            border: 1px solid var(--border-color);
            padding: 1.25rem 1.5rem;
            margin-bottom: 0.75rem;
            display: flex;
            gap: 1.25rem;
            align-items: flex-start;
            transition: all 0.2s ease;
            position: relative;
        }
        .notif-card:hover {
            box-shadow: var(--shadow-sm);
            transform: translateY(-1px);
        }
        .notif-card.unread {
            background: #FAF8FF;
            border-left: 4px solid var(--primary-color);
        }
        .notif-icon-box {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.15rem;
            flex-shrink: 0;
        }
        .notif-unread-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--primary-color);
            position: absolute;
            top: 1.25rem;
            right: 1.25rem;
        }
        .empty-state-box {
            text-align: center;
            padding: 4rem 1.5rem;
            background: white;
            border-radius: 16px;
            border: 1px dashed var(--border-color);
        }
    </style>
</head>
<body>

    <!-- Unified Navbar -->
    <header class="navbar">
        <div class="navbar-container">
            <a href="http://localhost:8082/index.html" class="navbar-logo" id="navLogoLink">
                <i class="fa-solid fa-ticket"></i> TIKARA
            </a>
            <ul class="navbar-menu" id="mainNavbarMenu"></ul>
            <div class="navbar-actions">
                <div id="navUserBox"></div>
                <button class="navbar-hamburger" id="navbarToggleBtn" aria-label="Buka menu navigasi">
                    <i class="fa-solid fa-bars"></i>
                </button>
            </div>
        </div>
        <nav class="navbar-mobile-drawer" id="navbarMobileDrawer"></nav>
    </header>

    <main class="notif-container">
        <!-- Header -->
        <div class="notif-header">
            <div>
                <h1 style="font-size: 1.6rem; font-weight: 800; color: var(--text-main); margin: 0 0 0.25rem; display: flex; align-items: center; gap: 0.6rem;">
                    <span>Pusat Notifikasi</span>
                    <span id="unreadBadge" style="display: none; font-size: 0.8rem; background: #EF4444; color: white; padding: 0.15rem 0.6rem; border-radius: 999px; font-weight: 700;">
                        0 baru
                    </span>
                </h1>
                <p style="font-size: 0.875rem; color: var(--text-muted); margin: 0;">
                    Update status transaksi tiket, pembayaran, dan informasi konser Anda.
                </p>
            </div>

            <div style="display: flex; gap: 0.6rem; align-items: center;">
                <button type="button" class="btn btn-outline" onclick="markAllAsRead()" style="width: auto; padding: 0.5rem 1rem; font-size: 0.85rem; border-radius: 8px;">
                    <i class="fa-solid fa-check-double"></i> Tandai Semua Dibaca
                </button>
            </div>
        </div>

        <!-- Filter Tabs -->
        <div class="filter-tabs">
            <button class="filter-tab active" onclick="setFilter('ALL')">Semua Notifikasi</button>
            <button class="filter-tab" onclick="setFilter('UNREAD')">Belum Dibaca</button>
            <button class="filter-tab" onclick="setFilter('TRANSACTION')">Pesanan & Bayar</button>
            <button class="filter-tab" onclick="setFilter('INFO')">Promo & Info</button>
        </div>

        <!-- Notification List Container -->
        <div id="notificationList">
            <div style="text-align: center; padding: 3rem; color: var(--text-muted);">
                <i class="fa-solid fa-spinner fa-spin fa-2x" style="color: var(--primary-color);"></i>
                <p style="margin-top: 0.75rem; font-size: 0.9rem;">Memuat notifikasi akun Anda...</p>
            </div>
        </div>
    </main>

    <script src="/js/script.js"></script>
    <script>
        let allNotifications = [];
        let currentFilter = 'ALL';
        let pollTimer = null;

        document.addEventListener('DOMContentLoaded', async () => {
            const auth = getAuthState();
            if (!auth.isAuthenticated) {
                showToast('Silakan login untuk melihat notifikasi Anda.', 'warning');
                setTimeout(() => {
                    window.location.href = `http://localhost:8081/login.html?redirect=${encodeURIComponent(window.location.href)}`;
                }, 1000);
                return;
            }

            await loadNotifications();

            // Polling notifikasi setiap 30 detik
            pollTimer = setInterval(loadNotificationsQuietly, 30000);
        });

        async function loadNotifications() {
            const token = (typeof getToken === 'function' ? getToken() : null) || (typeof getJwtToken === 'function' ? getJwtToken() : null) || localStorage.getItem('jwt_token');

            try {
                // notification_service runs on Port 8086
                const res = await fetch('http://localhost:8086/api/notifications/saya?page=0&size=50', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (res.ok) {
                    const pageData = await res.json();
                    allNotifications = pageData.content || [];
                } else {
                    allNotifications = [];
                }
                renderNotifications();
                updateUnreadBadge();
            } catch (err) {
                console.warn('Gagal memuat notifikasi dari server:', err);
                renderNotifications();
            }
        }

        async function loadNotificationsQuietly() {
            const token = (typeof getToken === 'function' ? getToken() : null) || (typeof getJwtToken === 'function' ? getJwtToken() : null) || localStorage.getItem('jwt_token');
            if (!token) return;

            try {
                const res = await fetch('http://localhost:8086/api/notifications/saya?page=0&size=50', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res.ok) {
                    const pageData = await res.json();
                    allNotifications = pageData.content || [];
                    renderNotifications();
                    updateUnreadBadge();
                }
            } catch (err) {
                console.warn('Quiet poll error:', err);
            }
        }

        function setFilter(filter) {
            currentFilter = filter;
            document.querySelectorAll('.filter-tab').forEach(btn => btn.classList.remove('active'));
            if (event && event.target) event.target.classList.add('active');
            renderNotifications();
        }

        function updateUnreadBadge() {
            const unreadCount = allNotifications.filter(n => !n.dibaca).length;
            const badge = document.getElementById('unreadBadge');
            if (badge) {
                if (unreadCount > 0) {
                    badge.innerText = `${unreadCount} belum dibaca`;
                    badge.style.display = 'inline-block';
                } else {
                    badge.style.display = 'none';
                }
            }
        }

        function formatRelativeTime(dateStr) {
            if (!dateStr) return 'Baru saja';
            const dt = new Date(dateStr);
            const now = new Date();
            const diffSec = Math.floor((now - dt) / 1000);

            if (diffSec < 60) return 'Baru saja';
            if (diffSec < 3600) return `${Math.floor(diffSec / 60)} menit lalu`;
            if (diffSec < 86400) return `${Math.floor(diffSec / 3600)} jam lalu`;
            if (diffSec < 172800) return `Kemarin ${dt.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' })}`;
            return dt.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
        }

        function getNotifVisuals(item) {
            const title = (item.judul || '').toLowerCase();
            const type = (item.tipe || '').toUpperCase();

            if (type === 'PAYMENT' || title.includes('bayar') || title.includes('lunas')) {
                return {
                    icon: 'fa-solid fa-credit-card',
                    bg: '#DCFCE7',
                    color: '#15803D',
                    link: 'http://localhost:8084/my-orders.html',
                    linkText: 'Lihat Transaksi'
                };
            }
            if (type === 'TICKET' || title.includes('tiket') || title.includes('qr')) {
                return {
                    icon: 'fa-solid fa-ticket',
                    bg: '#F3E8FF',
                    color: '#7C3AED',
                    link: 'http://localhost:8083/my-tickets.html',
                    linkText: 'Buka E-Tiket'
                };
            }
            if (type === 'ORDER' || title.includes('pesan') || title.includes('reservasi')) {
                return {
                    icon: 'fa-solid fa-bag-shopping',
                    bg: '#DBEAFE',
                    color: '#1D4ED8',
                    link: 'http://localhost:8084/my-orders.html',
                    linkText: 'Detail Pesanan'
                };
            }
            if (type === 'PROMO' || title.includes('promo') || title.includes('diskon')) {
                return {
                    icon: 'fa-solid fa-tag',
                    bg: '#FEF3C7',
                    color: '#B45309',
                    link: 'http://localhost:8082/index.html',
                    linkText: 'Jelajahi Konser'
                };
            }
            return {
                icon: 'fa-solid fa-bell',
                bg: '#F1F5F9',
                color: '#475569',
                link: null,
                linkText: null
            };
        }

        function renderNotifications() {
            const container = document.getElementById('notificationList');

            let filtered = allNotifications;
            if (currentFilter === 'UNREAD') {
                filtered = allNotifications.filter(n => !n.dibaca);
            } else if (currentFilter === 'TRANSACTION') {
                filtered = allNotifications.filter(n => {
                    const t = (n.tipe || '').toUpperCase();
                    const j = (n.judul || '').toLowerCase();
                    return t === 'ORDER' || t === 'PAYMENT' || t === 'TICKET' || j.includes('bayar') || j.includes('pesan');
                });
            } else if (currentFilter === 'INFO') {
                filtered = allNotifications.filter(n => {
                    const t = (n.tipe || '').toUpperCase();
                    const j = (n.judul || '').toLowerCase();
                    return t === 'PROMO' || t === 'SYSTEM' || j.includes('promo');
                });
            }

            if (!filtered || filtered.length === 0) {
                container.innerHTML = `
                    <div class="empty-state-box">
                        <i class="fa-regular fa-bell-slash fa-3x" style="color: #CBD5E1; margin-bottom: 1rem;"></i>
                        <h3 style="font-size: 1.15rem; font-weight: 700; color: var(--text-main); margin-bottom: 0.35rem;">
                            Belum Ada Notifikasi
                        </h3>
                        <p style="font-size: 0.85rem; color: var(--text-muted); max-width: 380px; margin: 0 auto 1.25rem;">
                            Semua pemberitahuan seputar pemesanan tiket, konfirmasi pembayaran, dan pengumuman konser akan tampil di sini.
                        </p>
                        <a href="http://localhost:8082/index.html" class="btn btn-outline" style="display: inline-flex; align-items: center; gap: 0.5rem; width: auto; padding: 0.55rem 1.25rem; font-size: 0.85rem;">
                            <i class="fa-solid fa-magnifying-glass"></i> Jelajahi Konser Musik
                        </a>
                    </div>
                `;
                return;
            }

            let html = '';
            filtered.forEach(item => {
                const isUnread = !item.dibaca;
                const visuals = getNotifVisuals(item);

                html += `
                    <div class="notif-card ${isUnread ? 'unread' : ''}" id="notifItem_${item.id}">
                        <div class="notif-icon-box" style="background: ${visuals.bg}; color: ${visuals.color};">
                            <i class="${visuals.icon}"></i>
                        </div>
                        <div style="flex: 1; min-width: 0;">
                            <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; margin-bottom: 0.25rem;">
                                <h3 style="font-size: 1rem; font-weight: 800; color: var(--text-main); margin: 0;">
                                    ${item.judul || 'Pemberitahuan TIKARA'}
                                </h3>
                                <span style="font-size: 0.75rem; color: var(--text-muted); white-space: nowrap;">
                                    ${formatRelativeTime(item.createdAt)}
                                </span>
                            </div>
                            <p style="font-size: 0.875rem; color: #475569; margin: 0 0 0.75rem; line-height: 1.5;">
                                ${item.pesan || '-'}
                            </p>
                            <div style="display: flex; gap: 1rem; align-items: center; font-size: 0.8rem;">
                                ${visuals.link ? `
                                    <a href="${visuals.link}" style="color: var(--primary-color); font-weight: 700; text-decoration: none; display: inline-flex; align-items: center; gap: 0.35rem;">
                                        ${visuals.linkText} <i class="fa-solid fa-arrow-right" style="font-size: 0.7rem;"></i>
                                    </a>
                                ` : ''}
                                ${isUnread ? `
                                    <button type="button" onclick="markAsRead(${item.id})" style="background: none; border: none; color: var(--text-muted); cursor: pointer; padding: 0; text-decoration: underline; font-size: 0.78rem;">
                                        Tandai sudah dibaca
                                    </button>
                                ` : ''}
                            </div>
                        </div>
                        ${isUnread ? '<div class="notif-unread-dot" title="Belum dibaca"></div>' : ''}
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        async function markAsRead(id) {
            const token = (typeof getToken === 'function' ? getToken() : null) || (typeof getJwtToken === 'function' ? getJwtToken() : null) || localStorage.getItem('jwt_token');
            try {
                const res = await fetch(`http://localhost:8086/api/notifications/${id}/read`, {
                    method: 'PUT',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res.ok) {
                    const target = allNotifications.find(n => n.id === id);
                    if (target) target.dibaca = true;
                    renderNotifications();
                    updateUnreadBadge();
                }
            } catch (err) {
                console.warn('Gagal menandai notifikasi dibaca:', err);
            }
        }

        async function markAllAsRead() {
            const unreadItems = allNotifications.filter(n => !n.dibaca);
            if (unreadItems.length === 0) {
                showToast('Semua notifikasi sudah dibaca.', 'info');
                return;
            }

            const token = (typeof getToken === 'function' ? getToken() : null) || (typeof getJwtToken === 'function' ? getJwtToken() : null) || localStorage.getItem('jwt_token');
            for (const item of unreadItems) {
                try {
                    await fetch(`http://localhost:8086/api/notifications/${item.id}/read`, {
                        method: 'PUT',
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    item.dibaca = true;
                } catch (e) {}
            }
            renderNotifications();
            updateUnreadBadge();
            showToast('Semua notifikasi berhasil ditandai sebagai dibaca.', 'success');
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pusat Notifikasi - TIKARA</title>
    <link rel="stylesheet" href="http://localhost:8081/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="navbar">
        <div class="navbar-container">
            <a href="http://localhost:8082/index.html" class="navbar-logo"><i class="fa-solid fa-ticket"></i> TIKARA</a>
        </div>
    </header>

    <main style="max-width:800px; margin:2.5rem auto; padding:0 1.5rem;">
        <h2 style="font-size:1.6rem; font-weight:800; color:var(--primary-color); margin-bottom:1.5rem;">🔔 Notifikasi Saya</h2>
        <div class="profile-card" style="padding:1.5rem;" id="notifList">
            <div style="padding:1rem; border-bottom:1px solid var(--border-color); display:flex; gap:1rem; align-items:flex-start;">
                <i class="fa-solid fa-circle-check fa-1x" style="color:var(--success-color); margin-top:0.2rem;"></i>
                <div>
                    <h4 style="font-size:1rem; color:var(--primary-color);">Pembayaran Tiket Berhasil</h4>
                    <p style="font-size:0.85rem; color:var(--text-muted);">Pembayaran tiket ORD-20260901-0001 telah berhasil diverifikasi sistem.</p>
                    <span style="font-size:0.75rem; color:#94A3B8;">Baru saja</span>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
